body {

h1 {

}

.container {

.container .col {

.col p:nth-child(1) {

.col:nth-child(1) p:nth-child(1) {

}

.col:nth-child(5) p:nth-child(1) {

.col p:nth-child(odd) {

.col:nth-child(1) p {

.col:nth-child(2) p {

.col:nth-child(4) p {

.col:nth-child(5) p {

.overlay {

    top: 0;
    left: 0;

    display: flex;
    flex-direction: column;
    align-items: center;

.load-progress {

    right: 11px;
    width: 6px;
    height: 6px;
    background-color: var(--white);

.load-progress::after {
    content: "";

    left: 11px;
    width: 6px;
    height: 6px;

let questionsData = []

async function fetchLocalJSON(fileName) {
    try {
        const response = await fetch(`json/${fileName}`);
        if (!response.ok) throw new Error(`تعذر تحميل ${fileName}`);
        const arr = await response.json();
        return Array.isArray(arr) ? arr : [];
    } catch (error) {
        console.error("⚠️ خطأ في تحميل الملف:", error);
        return [];
    }
}

async function loadAllTables() {
    const merged = await fetchLocalJSON("angko.json");

    answersData   = merged.map(item => item[1]);

    amthilahData  = merged.map(item => item[3]);
